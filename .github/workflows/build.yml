name: Build EXE
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller -r requirements.txt
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name WallpaperAnimado --add-data "videos;videos" app.py
      - uses: actions/upload-artifact@v4
        with: { name: WallpaperAnimado, path: dist/WallpaperAnimado.exe }
